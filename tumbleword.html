<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tumbleword</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700;800&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EBEE; --ink:#16232E; --muted:#4C5D69;
  --wall:#22384A; --floor:#F4F7F8;
  --tile:#F2C14B; --tile-edge:#C4922A; --tile-ink:#2B2008;
  --down:#0E9AA7; --win:#2E9E6B; --win-edge:#1F7449; --win-ink:#FFFFFF;
  --btn:#16232E; --btn-ink:#F4F7F8; --line:rgba(22,35,46,.22); --slot:rgba(22,35,46,.07);
  --slab:'Roboto Slab', Rockwell, 'Courier New', serif;
  --sans:'Work Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --ink:#E8EEF1; --muted:#9AAAB5;
    --wall:#05090C; --floor:#1C2832;
    --down:#25C2CF; --win:#3DBE83; --win-edge:#27895C;
    --btn:#E8EEF1; --btn-ink:#0F161C; --line:rgba(232,238,241,.26); --slot:rgba(232,238,241,.07);
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --ink:#E8EEF1; --muted:#9AAAB5;
  --wall:#05090C; --floor:#1C2832;
  --down:#25C2CF; --win:#3DBE83; --win-edge:#27895C;
  --btn:#E8EEF1; --btn-ink:#0F161C; --line:rgba(232,238,241,.26); --slot:rgba(232,238,241,.07);
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--sans); min-height:100vh; -webkit-tap-highlight-color:transparent; }
main{ max-width:520px; margin:0 auto; padding:16px 16px 32px; display:flex; flex-direction:column; align-items:center; gap:12px; }
header{ width:100%; display:flex; justify-content:space-between; align-items:baseline; }
h1{ font-family:var(--slab); font-weight:800; font-size:24px; margin:0; letter-spacing:.01em; }
.levelno{ font-size:14px; color:var(--muted); }

.word{ display:flex; gap:6px; justify-content:center; }
.slot{
  width:clamp(38px,11vw,50px); aspect-ratio:1; display:grid; place-items:center;
  border:2px solid var(--line); border-radius:8px; background:var(--slot);
  font-family:var(--slab); font-weight:800; font-size:clamp(20px,6vw,26px); color:var(--muted);
  transition:background .3s, color .3s, border-color .3s;
}
.slot.won{ background:var(--win); border-color:var(--win); color:var(--win-ink); }

.stats{ width:100%; max-width:460px; display:flex; justify-content:space-between; font-size:14px; color:var(--muted); min-height:20px; }
.stats b{ color:var(--ink); font-weight:600; }

.stage{ position:relative; width:min(100%, calc(100vh - 380px), 460px); min-width:250px; aspect-ratio:1; margin:6px 0 16px; }
.stage::after{ content:""; position:absolute; left:10%; right:10%; bottom:-14px; height:5px; border-radius:3px; background:var(--down); }
.board{
  position:absolute; inset:0; background:var(--wall); border-radius:12px; z-index:1;
  container-type:inline-size; transition:transform .45s cubic-bezier(.3,.7,.2,1);
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.grid,.cards{ position:absolute; inset:6px; }
.grid{ display:grid; grid-template-columns:repeat(var(--n),1fr); grid-template-rows:repeat(var(--n),1fr); }
.cell.floor{ background:var(--floor); margin:1.5px; border-radius:4px; }
.card{
  position:absolute; width:calc(100% / var(--n)); height:calc(100% / var(--n)); padding:3px;
  transition:left .36s cubic-bezier(.55,0,1,.7) .36s, top .36s cubic-bezier(.55,0,1,.7) .36s;
}
.face{
  width:100%; height:100%; display:grid; place-items:center; border-radius:6px;
  background:var(--tile); color:var(--tile-ink); box-shadow:0 3px 0 var(--tile-edge), inset 0 0 0 1px rgba(255,255,255,.35);
  font-family:var(--slab); font-weight:800; font-size:calc(100cqw / var(--n) * .5); line-height:1; user-select:none;
  transition:transform .45s cubic-bezier(.3,.7,.2,1), background .3s, box-shadow .3s, color .3s;
}
.face.won{ background:var(--win); color:var(--win-ink); box-shadow:0 3px 0 var(--win-edge), inset 0 0 0 1px rgba(255,255,255,.25); }

.status{ margin:0; min-height:2.8em; max-width:420px; text-align:center; font-size:15px; line-height:1.4; color:var(--muted); }
.status strong{ color:var(--ink); font-weight:600; }

.row{ width:100%; max-width:460px; display:flex; gap:10px; }
button{ font-family:var(--sans); cursor:pointer; }
button:focus-visible{ outline:3px solid var(--down); outline-offset:2px; }
.turn{
  flex:1; height:54px; border:0; border-radius:12px; background:var(--btn); color:var(--btn-ink);
  font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;
}
.turn:active{ transform:translateY(1px); }
.turn:disabled, .ghost:disabled{ opacity:.4; cursor:default; }
.turn svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.next{ background:var(--win); color:var(--win-ink); }
.ghost{ flex:1; height:42px; border:2px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); font-size:14px; font-weight:600; }
[hidden]{ display:none !important; }

nav.levels{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; max-width:460px; }
nav.levels button{
  width:34px; height:34px; border-radius:8px; border:2px solid var(--line); background:transparent; color:var(--muted);
  font-size:13px; font-weight:600;
}
nav.levels button[data-solved="1"]{ border-color:var(--win); color:var(--ink); }
nav.levels button[aria-current="true"]{ background:var(--ink); border-color:var(--ink); color:var(--bg); }

@media (prefers-reduced-motion: reduce){
  .board,.card,.face{ transition-duration:.01s !important; transition-delay:0s !important; }
}
/* Compound tile & completed word font scaling — readable on all grid sizes */
.face[data-len="1"]{ font-size:calc(100cqw / var(--n) * .54); }
.face[data-len="2"]{ font-size:calc(100cqw / var(--n) * .42); letter-spacing:-.03em; }
.face[data-len="3"]{ font-size:calc(100cqw / var(--n) * .34); letter-spacing:-.03em; }
.face[data-len="4"]{ font-size:calc(100cqw / var(--n) * .27); letter-spacing:-.02em; }
.face[data-len="5"]{ font-size:calc(100cqw / var(--n) * .23); letter-spacing:-.02em; }

/* Completed word badge styling (stays on the board and tumbles as an obstacle) */
.face.completed{
  background: var(--win) !important;
  color: #FFFFFF !important;
  box-shadow: 0 3px 0 var(--win-edge), inset 0 0 0 1px rgba(255,255,255,.45) !important;
  font-weight: 800;
  text-shadow: 0 1px 2px rgba(0,0,0,.25);
}

/* Durability badge in top-right corner of completed word tiles */
.face .badge{
  position: absolute;
  top: 2px;
  right: 2px;
  min-width: 14px;
  height: 14px;
  padding: 0 3px;
  background: rgba(0, 0, 0, 0.45);
  color: #FFFFFF;
  border-radius: 7px;
  font-family: var(--sans);
  font-size: calc(100cqw / var(--n) * .17);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  pointer-events: none;
  border: 1px solid rgba(255, 255, 255, 0.4);
}

.face .badge.expiring{
  background: #E84855 !important;
  border-color: #FFB3BA !important;
  animation: badgePulse 0.7s ease-in-out infinite alternate;
}

@keyframes badgePulse {
  0% { transform: scale(1); }
  100% { transform: scale(1.22); }
}

/* Teal bond-flash shown on the survivor tile when a merge completes */
.face.bonding{ background:var(--down) !important; color:#fff !important; box-shadow:0 3px 0 rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.3) !important; }

/* Spawn pop-in on the outer card (leaves face rotation intact so letters are always upright) */
@keyframes cardSpawn {
  0% { transform: scale(0.15); opacity: 0; }
  75% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.card.spawned{
  animation: cardSpawn .35s cubic-bezier(.34,1.56,.64,1) both;
}

/* Dissolve animation when a word reaches 0 durability */
@keyframes dissolveCard {
  0% { transform: scale(1); opacity: 1; filter: brightness(1.7); }
  35% { transform: scale(1.18); opacity: 0.9; }
  100% { transform: scale(0.1); opacity: 0; }
}
.card.dissolving{
  animation: dissolveCard .4s ease-out forwards;
  pointer-events: none;
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Tumbleword</h1>
    <span class="levelno" id="streakBadge">Streak <b id="streakVal">0</b></span>
  </header>

  <div class="word" id="word" aria-label="Target word"></div>
  <div class="stats">
    <span>Streak <b id="streak">0</b></span>
    <span>Best <b id="bestStreak">0</b></span>
    <span>Moves <b id="moves">0</b></span>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <p class="status" id="status" aria-live="polite"></p>

  <div class="row" id="turnrow">
    <button class="turn" id="left" type="button" aria-label="Turn maze left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v5h5"/><path d="M3.5 9A9 9 0 1 1 5 17"/></svg>Turn left
    </button>
    <button class="turn" id="right" type="button" aria-label="Turn maze right">
      Turn right<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4v5h-5"/><path d="M20.5 9A9 9 0 1 0 19 17"/></svg>
    </button>
  </div>
  <div class="row">
    <button class="ghost" id="undo" type="button">Undo</button>
    <button class="ghost" id="restart" type="button">Restart Run</button>
  </div>
</main>

<script>
const LEVELS = [
  {"word":"CAT","n":5,"walls":["...##","#..#.",".....",".#...","....."],"cards":[{"ch":"C","x":1,"y":2},{"ch":"A","x":3,"y":4},{"ch":"T","x":3,"y":3}],"best":5},
  {"word":"SUN","n":5,"walls":["#....","....#",".....",".#...",".#..."],"cards":[{"ch":"S","x":3,"y":4},{"ch":"U","x":0,"y":4},{"ch":"N","x":2,"y":4}],"best":6},
  {"word":"MAP","n":5,"walls":["#....",".#...","..#.#","#....","....#"],"cards":[{"ch":"M","x":1,"y":4},{"ch":"A","x":0,"y":2},{"ch":"P","x":3,"y":4}],"best":8},
  {"word":"SPIN","n":6,"walls":[".....#","......","......","#...#.","#.#...","......"],"cards":[{"ch":"S","x":5,"y":4},{"ch":"P","x":5,"y":5},{"ch":"I","x":2,"y":2},{"ch":"N","x":2,"y":3}],"best":9},
  {"word":"MAZE","n":6,"walls":["......",".#....","##.#..",".#....",".#..#.",".#...."],"cards":[{"ch":"M","x":5,"y":5},{"ch":"A","x":2,"y":5},{"ch":"Z","x":4,"y":3},{"ch":"E","x":3,"y":1}],"best":10},
  {"word":"TURN","n":6,"walls":["#.....","..#...","......","..#..#","..##..","......"],"cards":[{"ch":"T","x":3,"y":5},{"ch":"U","x":0,"y":5},{"ch":"R","x":3,"y":3},{"ch":"N","x":1,"y":5}],"best":10},
  {"word":"FROG","n":6,"walls":[".....#","......",".#....","....#.","......",".....#"],"cards":[{"ch":"F","x":4,"y":5},{"ch":"R","x":4,"y":2},{"ch":"O","x":1,"y":1},{"ch":"G","x":0,"y":5}],"best":11},
  {"word":"PLANT","n":7,"walls":["......#","...#...","..#....",".......","...#..#","...##..","...##.."],"cards":[{"ch":"P","x":5,"y":6},{"ch":"L","x":0,"y":5},{"ch":"A","x":6,"y":3},{"ch":"N","x":0,"y":6},{"ch":"T","x":1,"y":6}],"best":12},
  {"word":"BRICK","n":7,"walls":["#.....#","#..#...",".......",".#...##","..#...#",".......","......."],"cards":[{"ch":"B","x":6,"y":6},{"ch":"R","x":5,"y":2},{"ch":"I","x":1,"y":2},{"ch":"C","x":2,"y":3},{"ch":"K","x":0,"y":6}],"best":12},
  {"word":"WORLD","n":7,"walls":["##.....",".#.....","##..#..","#.#....",".....#.",".......","#......"],"cards":[{"ch":"W","x":3,"y":6},{"ch":"O","x":0,"y":5},{"ch":"R","x":4,"y":6},{"ch":"L","x":2,"y":2},{"ch":"D","x":5,"y":6}],"best":13},
  {"word":"GLYPH","n":7,"walls":["....#.#",".#....#",".......",".......","....#..","..#....","......."],"cards":[{"ch":"G","x":3,"y":6},{"ch":"L","x":1,"y":6},{"ch":"Y","x":2,"y":4},{"ch":"P","x":6,"y":5},{"ch":"H","x":6,"y":6}],"best":14},
  {"word":"MAGIC","n":7,"walls":["....##.","..#....","....#..",".##...#","...##.#","#..##..","#.....#"],"cards":[{"ch":"M","x":1,"y":6},{"ch":"A","x":6,"y":5},{"ch":"G","x":4,"y":3},{"ch":"I","x":3,"y":3},{"ch":"C","x":0,"y":4}],"best":14}
];

const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // up, right, down, left
const mod = (a,m) => ((a % m) + m) % m;
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const LOCK_MS  = reduce ? 60  : 820;
const MERGE_MS = reduce ? 20  : 320;
let nextCardId = 0;

// Standard 7x7 wall layout from level 7 that accommodates all word lengths
const BOARD_N = 7;
const BOARD_WALLS = ["......#","...#...","..#....",".......","...#..#","...##..","...##.."];

const isCompleted = c => !!(c && (c.completed || c.isCompletedWord));

// Settle all tiles (active letters and completed word blocks tumble together)
function settle(n, walls, cards, g){
  const [dx,dy] = DIRS[g];
  const order = cards.map((c,i)=>i).sort((a,b)=>(cards[b].x*dx+cards[b].y*dy)-(cards[a].x*dx+cards[a].y*dy));
  const out = cards.map(c=>({...c}));
  const occ = new Set(out.map(c=>c.x+','+c.y));
  for(const i of order){
    let {x,y} = out[i]; occ.delete(x+','+y);
    while(true){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=n||ny>=n||walls[ny][nx]==='#'||occ.has(nx+','+ny)) break;
      x=nx; y=ny;
    }
    out[i].x=x; out[i].y=y; occ.add(x+','+y);
  }
  return out;
}

// Merge adjacent active letters for the current target word
function tryMerge(word, cards){
  const merges = [];
  let cur = cards.map(c=>({...c}));
  let changed = true;
  while(changed){
    changed = false;
    const at = new Map(cur.map((c,i)=>[c.x+','+c.y, i]));
    loop: for(let i=0; i<cur.length; i++){
      const ci = cur[i];
      if(isCompleted(ci) || ci.wi === undefined) continue; // completed words never merge
      for(const [dx,dy] of DIRS){
        const j = at.get((ci.x+dx)+','+(ci.y+dy));
        if(j === undefined) continue;
        const cj = cur[j];
        if(isCompleted(cj) || cj.wi === undefined) continue;
        let sIdx, aIdx, merged;
        if(ci.we+1 === cj.wi){          // ci before cj -> ci survives
          sIdx=i; aIdx=j;
          merged = {...ci, ch:word.slice(ci.wi, cj.we+1), we:cj.we, completed:false, isCompletedWord:false};
        } else if(cj.we+1 === ci.wi){   // cj before ci -> cj survives
          sIdx=j; aIdx=i;
          merged = {...cj, ch:word.slice(cj.wi, ci.we+1), we:ci.we, completed:false, isCompletedWord:false};
        } else continue;
        merges.push({
          survivorId: cur[sIdx].id, absorbedId: cur[aIdx].id,
          toX: merged.x, toY: merged.y, newCh: merged.ch
        });
        cur = cur.filter((_,k) => k!==sIdx && k!==aIdx);
        cur.push(merged);
        changed = true; break loop;
      }
    }
  }
  return { newCards: cur, merges };
}

// Check win condition against active cards only
function findWin(word, cards){
  const active = cards.filter(c => !isCompleted(c) && c.wi !== undefined);
  // Full-merge win
  const full = active.find(c => c.ch === word);
  if(full) return [full.id];
  // Spatial win
  const at = new Map(active.map(c => [c.x+','+c.y, c]));
  for(const [dx,dy] of DIRS){
    for(const start of active){
      if(start.wi !== 0) continue;
      const ids = [start.id];
      let x=start.x+dx, y=start.y+dy, exp=start.we+1;
      while(exp < word.length){
        const c = at.get(x+','+y);
        if(!c || c.wi !== exp) break;
        ids.push(c.id); exp=c.we+1; x+=dx; y+=dy;
      }
      if(exp === word.length) return ids;
    }
  }
  return null;
}

const $ = id => document.getElementById(id);
const boardEl=$('board'), gridEl=$('grid'), cardsEl=$('cards'), wordEl=$('word');
let S = null, cardEls = new Map(), bestStreak = 0;

try{ bestStreak = parseInt(localStorage.getItem('tumbleword-best-streak')||'0', 10) || 0; }catch(e){ bestStreak=0; }
function saveBestStreak(){ try{ localStorage.setItem('tumbleword-best-streak', S.bestStreak); }catch(e){} }

// Find open floor cells on the board to spawn new word tiles
function findSpawnPositions(targetLevel, count, existingCards){
  const occ = new Set(existingCards.map(c => c.x+','+c.y));
  const positions = [];
  // 1. Try original level coordinates if free
  for(const c of targetLevel.cards){
    if(c.x < BOARD_N && c.y < BOARD_N && BOARD_WALLS[c.y][c.x] !== '#' && !occ.has(c.x+','+c.y)){
      positions.push({x: c.x, y: c.y});
      occ.add(c.x+','+c.y);
      if(positions.length === count) return positions;
    }
  }
  // 2. Search for any open floor cells (top to bottom)
  for(let y=0; y<BOARD_N; y++){
    for(let x=0; x<BOARD_N; x++){
      if(BOARD_WALLS[y][x] !== '#' && !occ.has(x+','+y)){
        positions.push({x, y});
        occ.add(x+','+y);
        if(positions.length === count) return positions;
      }
    }
  }
  return positions;
}

function startEndlessRun(){
  S = {
    n: BOARD_N,
    walls: BOARD_WALLS,
    r: 0,
    angle: 0,
    wordIdx: 0,
    streak: 0,
    bestStreak: bestStreak,
    moves: 0,
    cards: [],
    hist: [],
    locked: false
  };

  boardEl.style.setProperty('--n', BOARD_N);
  boardEl.style.transition = 'none';
  boardEl.style.transform = 'rotate(0deg)';
  void boardEl.offsetWidth;
  boardEl.style.transition = '';

  gridEl.innerHTML = '';
  for(let y=0; y<BOARD_N; y++) for(let x=0; x<BOARD_N; x++){
    const d = document.createElement('div');
    d.className = 'cell' + (BOARD_WALLS[y][x] === '#' ? '' : ' floor');
    gridEl.appendChild(d);
  }

  spawnNextWord(true);
}

function spawnNextWord(isInitial){
  const lv = LEVELS[S.wordIdx];
  const charWi = {};
  for(let k=0; k<lv.word.length; k++) charWi[lv.word[k]] = k;

  const positions = findSpawnPositions(lv, lv.word.length, S.cards);
  const newLetters = [...lv.word].map((ch, idx) => ({
    id: nextCardId++,
    ch: ch,
    x: positions[idx] ? positions[idx].x : 0,
    y: positions[idx] ? positions[idx].y : 0,
    wi: charWi[ch],
    we: charWi[ch],
    completed: false,
    isCompletedWord: false,
    isNew: !isInitial
  }));

  S.cards.push(...newLetters);

  // Update target word display
  wordEl.innerHTML = '';
  [...lv.word].forEach(ch => {
    const s = document.createElement('div');
    s.className = 'slot';
    s.textContent = ch;
    wordEl.appendChild(s);
  });

  rebuildCardDOM(isInitial);
  render();
  void cardsEl.offsetWidth;
  enableCardTransitions();

  updateUI();
  if(isInitial){
    setStatus('Spell <strong>' + lv.word + '</strong>. Completed words stay on board and tumble as obstacles!');
  } else {
    setStatus('Now spell <strong>' + lv.word + '</strong>! Completed words remain on the board.');
  }
}

function updateFaceDOM(face, c){
  face.setAttribute('data-len', c.ch.length);
  if(isCompleted(c)){
    face.classList.add('completed');
    face.innerHTML = '';
    const txt = document.createElement('span');
    txt.className = 'label';
    txt.textContent = c.ch;
    face.appendChild(txt);

    if(c.lifespan !== undefined && c.lifespan > 0){
      const badge = document.createElement('span');
      badge.className = 'badge' + (c.lifespan === 1 ? ' expiring' : '');
      badge.textContent = c.lifespan;
      face.appendChild(badge);
    }
  } else {
    face.classList.remove('completed');
    face.innerHTML = '';
    face.textContent = c.ch;
  }
}

function rebuildCardDOM(noAnim){
  cardsEl.innerHTML = '';
  cardEls.clear();
  S.cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'card' + (c.isNew ? ' spawned' : '');
    if(noAnim) el.style.transition = 'none';
    const f = document.createElement('div');
    f.className = 'face';
    updateFaceDOM(f, c);
    el.appendChild(f);
    cardsEl.appendChild(el);
    cardEls.set(c.id, el);
    c.isNew = false;
  });
}

function enableCardTransitions(){
  cardEls.forEach(el => { el.style.transition = ''; });
}

function render(){
  boardEl.style.transform = 'rotate(' + S.angle + 'deg)';
  S.cards.forEach(c => {
    const el = cardEls.get(c.id);
    if(!el) return;
    el.style.left = (c.x * 100 / BOARD_N) + '%';
    el.style.top = (c.y * 100 / BOARD_N) + '%';
    const face = el.firstChild;
    face.style.transform = 'rotate(' + (-S.angle) + 'deg)';
    updateFaceDOM(face, c);
  });
}

function setStatus(html){ $('status').innerHTML = html; }

function updateUI(){
  $('moves').textContent = S.moves;
  $('streak').textContent = S.streak;
  $('streakVal').textContent = S.streak;
  $('bestStreak').textContent = S.bestStreak;
  $('left').disabled = S.locked;
  $('right').disabled = S.locked;
  $('undo').disabled = S.locked || S.hist.length === 0;
  $('restart').disabled = S.locked;
}

// Complete active word: transform into 1 completed word block with durability,
// count down previous words, dissolve expired ones, and spawn next word.
function completeWord(winIds){
  S.locked = true;
  const currentWord = LEVELS[S.wordIdx].word;
  // Flash word slots green
  wordEl.querySelectorAll('.slot').forEach(s => s.classList.add('won'));

  // Merge winning active cards into 1 completed card at survivor position
  const winCards = S.cards.filter(c => winIds.includes(c.id));
  const survivor = winCards[0];
  survivor.ch = currentWord;
  survivor.completed = true;
  survivor.isCompletedWord = true;
  survivor.lifespan = currentWord.length; // Durability = letter count (e.g. CAT = 3 words)
  delete survivor.wi;
  delete survivor.we;

  // Decrement lifespan on all previously completed words
  const expiredIds = [];
  S.cards.forEach(c => {
    if(isCompleted(c) && c.id !== survivor.id && c.lifespan !== undefined){
      c.lifespan--;
      if(c.lifespan <= 0){
        expiredIds.push(c.id);
      }
    }
  });

  // Animate dissolving cards
  expiredIds.forEach(id => {
    const el = cardEls.get(id);
    if(el) el.classList.add('dissolving');
  });

  // Remove absorbed cards from winIds
  const removeCards = winCards.slice(1);
  const removeIds = removeCards.map(c => c.id);

  if(removeIds.length > 0 && !reduce){
    removeIds.forEach(id => {
      const el = cardEls.get(id);
      if(!el) return;
      el.style.transition = 'left ' + MERGE_MS + 'ms ease-in,top ' + MERGE_MS + 'ms ease-in,opacity ' + MERGE_MS + 'ms linear';
      el.style.left = (survivor.x * 100 / BOARD_N) + '%';
      el.style.top = (survivor.y * 100 / BOARD_N) + '%';
      el.style.opacity = '0';
    });
  }

  setTimeout(() => {
    // Clean up absorbed cards
    removeIds.forEach(id => {
      const el = cardEls.get(id);
      if(el) el.remove();
      cardEls.delete(id);
    });
    // Clean up expired completed cards
    expiredIds.forEach(id => {
      const el = cardEls.get(id);
      if(el) el.remove();
      cardEls.delete(id);
    });

    S.cards = S.cards.filter(c => !removeIds.includes(c.id) && !expiredIds.includes(c.id));

    // Style the survivor as completed
    const sEl = cardEls.get(survivor.id);
    if(sEl){
      updateFaceDOM(sEl.firstChild, survivor);
      sEl.firstChild.classList.add('bonding');
      setTimeout(() => sEl.firstChild.classList.remove('bonding'), 380);
    }

    // Refresh remaining badges
    render();

    S.streak++;
    if(S.streak > S.bestStreak){
      S.bestStreak = S.streak;
      saveBestStreak();
    }
    updateUI();

    const expireNote = expiredIds.length > 0 ? ' (An old word dissolved!)' : '';
    setStatus('<strong>' + currentWord + '</strong> formed! Streak <strong>' + S.streak + '</strong>!' + expireNote + ' Next word incoming...');

    setTimeout(() => {
      S.wordIdx = (S.wordIdx + 1) % LEVELS.length;
      spawnNextWord(false);
      S.locked = false;
      updateUI();
    }, 600);
  }, (removeIds.length > 0 || expiredIds.length > 0) && !reduce ? MERGE_MS + 40 : 150);
}

function applyMergeAnimation(merges, newCards){
  if(reduce){
    merges.forEach(m => {
      const a = cardEls.get(m.absorbedId); if(a){ a.remove(); cardEls.delete(m.absorbedId); }
      const s = cardEls.get(m.survivorId);
      if(s){ updateFaceDOM(s.firstChild, { ch: m.newCh, completed: false }); }
    });
    S.cards = newCards;
    render();
    const winIds = findWin(LEVELS[S.wordIdx].word, S.cards);
    if(winIds) completeWord(winIds);
    else { S.locked = false; updateUI(); }
    return;
  }

  merges.forEach(m => {
    const el = cardEls.get(m.absorbedId); if(!el) return;
    el.style.transition = 'left ' + MERGE_MS + 'ms ease-in,top ' + MERGE_MS + 'ms ease-in,opacity ' + MERGE_MS + 'ms linear';
    el.style.left = (m.toX * 100 / BOARD_N) + '%';
    el.style.top = (m.toY * 100 / BOARD_N) + '%';
    el.style.opacity = '0';
  });

  setTimeout(() => {
    merges.forEach(m => {
      const a = cardEls.get(m.absorbedId); if(a){ a.remove(); cardEls.delete(m.absorbedId); }
      const sur = cardEls.get(m.survivorId);
      if(sur){
        updateFaceDOM(sur.firstChild, { ch: m.newCh, completed: false });
        sur.firstChild.classList.add('bonding');
        setTimeout(() => sur.firstChild.classList.remove('bonding'), 380);
      }
    });
    S.cards = newCards;
    render();
    const winIds = findWin(LEVELS[S.wordIdx].word, S.cards);
    if(winIds) completeWord(winIds);
    else { S.locked = false; updateUI(); }
  }, MERGE_MS + 30);
}

function afterSettle(){
  const curWord = LEVELS[S.wordIdx].word;
  // 1. Check spatial win before merging
  const winIds = findWin(curWord, S.cards);
  if(winIds){
    completeWord(winIds);
    return;
  }
  // 2. Apply active letter bonding
  const {newCards, merges} = tryMerge(curWord, S.cards);
  if(merges.length === 0){
    S.cards = newCards;
    S.locked = false;
    updateUI();
  } else {
    applyMergeAnimation(merges, newCards);
  }
}

function turn(dir){
  if(S.locked) return;
  const nr = mod(S.r + dir, 4);
  S.hist.push({
    dir,
    r: S.r,
    wordIdx: S.wordIdx,
    streak: S.streak,
    moves: S.moves,
    cards: S.cards.map(c => ({...c}))
  });
  S.r = nr;
  S.angle += 90 * dir;
  S.moves++;
  S.cards = settle(BOARD_N, BOARD_WALLS, S.cards, mod(2 - nr, 4));
  S.locked = true;
  render();
  updateUI();
  setTimeout(afterSettle, LOCK_MS);
}

function undo(){
  if(S.locked || !S.hist.length) return;
  const h = S.hist.pop();
  S.angle -= 90 * h.dir;
  S.r = h.r;
  S.wordIdx = h.wordIdx;
  S.streak = h.streak;
  S.moves = h.moves;
  S.cards = h.cards.map(c => ({...c}));
  S.locked = true;

  // Re-sync target word display
  const lv = LEVELS[S.wordIdx];
  wordEl.innerHTML = '';
  [...lv.word].forEach(ch => {
    const s = document.createElement('div');
    s.className = 'slot';
    s.textContent = ch;
    wordEl.appendChild(s);
  });

  rebuildCardDOM(true);
  render();
  void cardsEl.offsetWidth;
  enableCardTransitions();

  setStatus('Now spell <strong>' + lv.word + '</strong>! Completed words remain on the board.');
  updateUI();
  setTimeout(() => { S.locked = false; updateUI(); }, LOCK_MS);
}

$('left').onclick = () => turn(-1);
$('right').onclick = () => turn(1);
$('undo').onclick = undo;
$('restart').onclick = () => { if(!S.locked) startEndlessRun(); };

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowLeft'){ e.preventDefault(); turn(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); turn(1); }
  else if(e.key === 'z' || e.key === 'Z') undo();
  else if(e.key === 'r' || e.key === 'R'){ if(!S.locked) startEndlessRun(); }
});

startEndlessRun();
</script>
