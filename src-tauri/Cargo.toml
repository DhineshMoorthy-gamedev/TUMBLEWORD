[package]
name        = "rotatle"
version     = "0.0.17"
description = "Rotatle — A rotating gravity word puzzle game"
edition     = "2021"

[lib]
name = "rotatle_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tauri              = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
